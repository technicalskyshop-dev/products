version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: curated_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: curated_discovery
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d curated_discovery"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

